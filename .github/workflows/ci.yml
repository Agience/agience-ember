name: ci

# Two jobs, because "it installs" and "it works" are different claims and one run tests neither.
#
# Ember declares four dependencies and three of them are siblings — `agience-prism`,
# `agience-crystal`, `agience-mantle`. The install job resolves them FROM AN INDEX, which is the only
# way to catch a dependency that names a distribution nobody publishes; every checkout in the
# developer workspace is `pip install -e`'d, and an editable install satisfies an import without ever
# resolving the requirement.
#
# The suite job resolves them from this organization's repositories instead, so the tests run against
# the revision beside this one rather than against whatever version PyPI served that day.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  # The install, from an index. Nothing here is a checkout.
  install-resolves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - name: A bare `import ember` works
        run: |
          python - <<'PY'
          import ember
          # `ember/__init__.py` imports `crystal.ontology` at module scope, so this line is what
          # catches an undeclared or misnamed sibling: it raised ImportError for exactly that
          # reason once, and only an install from an index can see it.
          print("import ember: ok")
          PY
      - name: The console script resolves
        run: python -c "from ember.cli import main; print('ember console script ok')"

  # The suite. No token, no operator payloads, no environment variable — every checkout below is a
  # PUBLIC sibling ember actually declares, and a fork can run this job as-is.
  #
  # It needed a private checkout until the tests that exercise operators through the runner moved to
  # `agience-chorus`, beside the operators they are about. Ember executes those payloads at runtime;
  # its own suite tests the engine.
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # prism, crystal and mantle are PUBLIC and carry no token line: a token on a public checkout
      # is noise that hides which one actually needs a credential.
      #
      # Each `path:` is the repository's OWN name, and that is load-bearing rather than tidy.
      # `tests/_paths.py` finds the workspace by looking for a directory named `agience-mantle`, and
      # several tests put a sibling's `src/` on `sys.path` through `repo("agience-mantle")`. A
      # shortened checkout directory makes that lookup miss — and `sys.path.insert` of a path that
      # does not exist is a no-op, so the tests would go on passing while measuring nothing.
      # `.siblings/` rather than true siblings because `actions/checkout` cannot write above the
      # workspace; `_paths.py` accepts both layouts.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agience-prism-py
          path: .siblings/agience-prism-py

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agience-crystal
          path: .siblings/agience-crystal

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agience-mantle
          path: .siblings/agience-mantle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install './.siblings/agience-prism-py[trust,vector,wire]' './.siblings/agience-crystal[ontology]' ./.siblings/agience-mantle
      # `optics` too, not just `dev`. This job is the FULL suite and 8 of its test files import
      # `ember.optics`, whose one eager `import entroptics` then fails at collection --
      # ModuleNotFoundError, 8 collection errors, red on every commit. `entroptics` is an extra by
      # design (the entroptics-free surface is real), so the base install correctly omits it; the
      # job that proves that surface is `install-resolves`, which installs the base and passes.
      # A suite calling itself full while skipping the instrument was testing less than it claimed.
      - run: pip install -e '.[dev,optics]'
      - name: Run the suite
        env:
          # One thread is the only safe setting in CI: OpenBLAS otherwise faults at exit or hangs.
          OPENBLAS_NUM_THREADS: "1"
        run: python -m pytest -q --timeout=300

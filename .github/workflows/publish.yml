name: Release

# Cut a release by pushing a tag. The tag minus "v" must match `version` in pyproject.toml, and the
# job below refuses the pair when they disagree:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# One job builds, creates the GitHub Release, and publishes to PyPI via Trusted Publishing (OIDC) —
# no token stored. Tests are not re-run here: ci.yml gates every commit on main, and the tag points
# at a tested one.
#
# Ember is distributed on PyPI and only on PyPI; there is no image.
#
# ORDERING: ember declares `agience-crystal`, so crystal must be on PyPI at or above the version
# below before an ember release resolves for anyone but this workspace. The install job in ci.yml is
# what tells you whether that is true today — it resolves from an index and fails when it is not.
#
# Two things must be true before a tag publishes anything, and neither lives in this file:
#
#   1. A PyPI Trusted Publisher for `agience-ember` naming this repository, this workflow file, and
#      the `pypi` environment below. Without it the publish step fails at the OIDC exchange.
#   2. A `pypi` environment on this repository. The `environment:` key below is what the publisher
#      matches against.
#
# A version is permanent once published: PyPI refuses a re-upload of the same version, so a bad cut
# is fixed by releasing a new version rather than by replacing one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}      # manual dry run: builds and twine-checks, publishes nothing

permissions:
  contents: write            # create the GitHub Release
  id-token: write            # PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi         # must match the PyPI publisher's Environment name
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$tag  pyproject=$ver"
          test "$tag" = "$ver" || { echo "::error::tag v$tag != pyproject version $ver"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: The wheel ships only ember
        run: |
          python - <<'PY'
          import glob, zipfile
          whl, = glob.glob("dist/*.whl")
          z = zipfile.ZipFile(whl)
          roots = {n.split("/")[0] for n in z.namelist()}
          roots = {r for r in roots if not r.endswith(".dist-info")}
          assert roots == {"ember"}, "the wheel ships %s" % (sorted(roots),)
          declared = z.read([n for n in z.namelist() if n.endswith("top_level.txt")][0]).decode().split()
          assert declared == ["ember"], "top_level.txt declares %r" % (declared,)
          print("wheel:", whl, "-> ember only")
          PY
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
